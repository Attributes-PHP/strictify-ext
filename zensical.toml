[project]
site_name = "Strictify"
site_url = "https://strictify.attributes-php.com"
site_description = "A type-hint validation library for PHP"
copyright = "© 2026 Attributes-PHP"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "validate()" = "validate.md" },
  { "call()" = "call.md" },
  { "Constraints" = "constraints.md" },
]

[project.theme]
features = [
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
]

# Light mode, following the system preference
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"
