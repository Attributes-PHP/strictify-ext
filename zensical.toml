[project]
site_name = "Strictify"
site_url = "https://strictify.attributes-php.com"
site_description = "A type-hint validation library for PHP"
copyright = "© 2026 Attributes-PHP"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Overview" = "index.md" },
  { "Quickstart" = "quickstart.md" },
  { "Guides" = [
    { "Validating payloads" = "guides/validating-payloads.md" },
    { "Nested models and arrays" = "guides/nested-models.md" },
    { "Aliases and aliasGenerator" = "guides/aliases.md" },
    { "Error messages" = "guides/error-messages.md" },
    { "Sensitive data" = "guides/sensitive-data.md" },
    { "Calling functions" = "guides/calling-functions.md" },
    { "Serializing models" = "guides/serializing-models.md" },
  ]},
  { "Reference" = [
    { "validate()" = "validate.md" },
    { "toDict()" = "toDict.md" },
    { "call()" = "call.md" },
    { "ModelConfigs" = "model-configs.md" },
    { "Constraints" = "constraints.md" },
    { "Exceptions" = "exceptions.md" },
    { "API" = "api.md" },
  ]},
  { "Benchmarks" = "benchmarks.md" },
  { "FAQ" = "faq.md" },
  { "Changelog" = "changelog.md" },
]

[project.theme]
features = [
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "navigation.sections",
  "content.code.copy",
  "content.action.copy",
]

# Light mode, following the system preference
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "pink"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "pink"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

# LLM-friendly exports (https://llmstxt.org): every build emits llms.txt (an
# index of the pages below), llms-full.txt (all pages in one file) and a
# Markdown copy of each listed page at <page>/index.md.
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
Strictify is a Pydantic-inspired data-validation system for PHP 8.2+ that validates raw data against
class type hints: a model's public property types are the schema, with no YAML and no config files.
It ships as two interchangeable packages sharing one `Attributes\\Strictify` API: the pure-PHP
Composer library `attributes-php/strictify` (`composer require attributes-php/strictify`) for the
widest compatibility, and the C extension `attributes-php/strictify-ext`
(`pie install attributes-php/strictify-ext`, roughly an order of magnitude faster) for hosts you
control. Core entry points: `Attributes\\Strictify\\validate()` hydrates a
`BaseModel` from an array and throws `ValidationException` on invalid data, `BaseModel::toDict()`
serializes a model back to an array, and `Attributes\\Strictify\\call()` invokes any callable with
validated model parameters. Models are configured with `#[ModelConfigs]`, values are constrained
with the constraint attributes, and failures are reported per field path via
`ValidationException::getErrors()`. Source code: library https://github.com/Attributes-PHP/strictify,
extension https://github.com/Attributes-PHP/strictify-ext
"""

[project.plugins.llmstxt.sections]
"Getting started" = [
  { "index.md" = "Overview: what Strictify is, the library and extension packages, how validation works, requirements and installation" },
  { "quickstart.md" = "Install Strictify (Composer library or PIE extension), define a first model and validate data in under a minute" },
]
"Guides" = [
  { "guides/validating-payloads.md" = "How validate() checks raw data: required fields, strict vs loose mode, return semantics, validation hooks" },
  { "guides/nested-models.md" = "Nested BaseModel properties and typed arrays with Sequence, Union, Intersection and Dict" },
  { "guides/aliases.md" = "Accept differently-named input keys with #[Alias] and the ModelConfigs aliasGenerator" },
  { "guides/error-messages.md" = "Customize error messages per property with ErrorMessage, or translate them all with ErrorTranslator" },
  { "guides/sensitive-data.md" = "Keep secrets out of toDict() output, error messages and dumps with #[Sensitive]" },
  { "guides/calling-functions.md" = "Invoke any callable with validated model parameters and injected dependencies using call()" },
  { "guides/serializing-models.md" = "Turn a hydrated model back into a plain array with toDict()" },
]
"Reference" = [
  { "validate.md" = "validate(): signature, parameters, return value, exceptions and the validation rules" },
  { "toDict.md" = "BaseModel::toDict(): array serialization, field names, useAlias, DateTime formatting, nesting" },
  { "call.md" = "call(): model hydration, dependency injection and lazy containers" },
  { "model-configs.md" = "#[ModelConfigs]: every option, its default, inheritance rules and resolved-config getters" },
  { "constraints.md" = "Built-in constraint attributes grouped by category, and how to write custom constraints" },
  { "exceptions.md" = "Exceptions Strictify throws: ValidationException and getErrors(), plus error cases" },
  { "api.md" = "Generated API reference: functions, classes, attributes and enums, built from stubs/*.stub.php" },
]
"Optional" = [
  { "faq.md" = "Frequently asked questions: library vs extension, strict vs loose mode, extra keys, error paths, hooks, performance" },
  { "changelog.md" = "Release notes, newest first" },
]
